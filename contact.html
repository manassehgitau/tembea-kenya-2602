<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tembea Kenya | Contact Us</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="./index.html">Home</a>
            <a href="./about.html">About Us</a>
            <a href="./destinations.html">tourist desintations</a>
            <a href="./contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <form action="">
            <label for="name">Full Name:*</label>
            <input type="text" name="name" id="name" placeholder="Enter your Full Name" required>

            <label for="email">Email Address:*</label>
            <input type="email" name="email" id="email" placeholder="johndoe@email.com" required>

            <label for="destination">Choose your destination:</label>
            <select name="destination" id="destination">
                <option value="#">--choose--</option>
                <option value="mombasa">Mombasa</option>
                <option value="m,alindi">Malindi</option>
                <option value="kilifi">Kilfi</option>
                <option value="amboseli">Amboseli</option>
                <option value="mara=">Massai Mara</option>
                <option value="nairobi-nat">Nairobi National</option>
            </select>

            <fieldset>
                <legend> travel style (Budget / Mid-range / Luxury)</legend>
                <input type="radio" name="budget" id="budget">
                <label for="budget">Budget Friendly</label>

                <input type="radio" name="mid" id="mid">
                <label for="mid">Mid-Range</label>

                <input type="radio" name="luxury" id="luxury">
                <label for="luxury">Luxury</label>
            </fieldset>

            <label for="message">Do you have any message for us?</label>
            <textarea name="message" id="message" cols="30" rows="10"></textarea>
        </form>
    </main>
    
    <footer>
        <p>© 2026 Manasseh Gitau, all rights reserved</p>
    </footer>
</body>
</html>
